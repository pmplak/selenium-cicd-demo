# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en

reviews:
  high_level_summary: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  path_instructions:
    - path: "docs/**/*.md"
      instructions: |
        Review Markdown documentation for:
        - Grammar and spelling
        - Consistent heading hierarchy
        - Technical accuracy
        - Markdown formatting
        - Broken links (if any)

    - path: "src/main/java/**/*.java"
      instructions: |
        Review Java code for:
        - SOLID principles
        - Clean code practices
        - Proper exception handling
        - Logging best practices
        - Avoid unnecessary code duplication
        - Avoid Thread.sleep() where explicit waits are appropriate
        - Maintain readable method and class names

    - path: "src/test/java/**/*.java"
      instructions: |
        Review Selenium automation tests for:
        - One business scenario per test
        - Clear and descriptive test names
        - Prefer Page Object Model over duplicated locators
        - Explicit waits instead of Thread.sleep()
        - Reliable assertions with meaningful failure messages
        - Reusable test utilities instead of duplicated code
        - Proper exception handling where appropriate
        - Readable and maintainable test flow

    - path: "pom.xml"
      instructions: |
        Review Maven configuration for:
        - Duplicate dependencies
        - Version conflicts
        - Missing dependency versions
        - Unused dependencies
        - Proper plugin configuration
        - Dependency scope correctness
        - Maintain dependency version consistency
        - Ensure plugin versions are explicitly defined
        - Avoid unnecessary transitive dependencies
        - Keep the build configuration clean and maintainable

    - path: ".gitignore"
      instructions: |
        Review the Git ignore configuration for:
        - Unnecessary ignored files
        - Missing common IDE and build artifacts
        - Sensitive files that should never be committed
        - Duplicate ignore patterns
        - Repository cleanliness

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto

  issues:
    scope: auto
